[package]
name = "multi-sig"
version = "1.4.0"
edition = "2024"
rust-version = "1.96"
authors = ["Dave Grantham <dwg@linuxprogrammer.org>"]
description = "Multisig self-describing multicodec implementation for digital signatures"
repository = "https://github.com/cryptidtech/multi-sig.git"
readme = "README.md"
license = "Apache-2.0"
keywords = ["multiformats", "multisig", "signatures", "crypto"]
categories = ["cryptography", "encoding"]

[features]
default = ["serde", "lamport", "xmss"]
# `serde` is now a required dependency because the core `threshold_meta`
# module (always compiled) derives `Serialize`/`Deserialize` for its CBOR
# blob types. The feature flag is retained for backward compatibility and
# controls only the public `serde` impl module.
serde = []
lamport = ["dep:lamport_signature_plus", "dep:sha3", "dep:sha2", "dep:blake2", "dep:shake", "dep:blake3"]
xmss = ["dep:xmss"]

# Local multi-codec 1.4.0 until it is published (remove at release).
[dependencies]
ciborium = "0.2"
chacha20poly1305 = "0.11"
elliptic-curve = "0.14"
getrandom = { version = "0.4" }
# blsful configured per-target below (blst for native, rust for wasm)
multi-base = { version = "1.0", default-features = false }
multi-codec = "1.4"
multi-trait = { version = "1.0", default-features = false }
multi-util = "1.1"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
ssh-encoding = "0.3"
thiserror = { version = "2.0" }
unsigned-varint = { version = "0.8", features = ["std"] }
zeroize = "1"
# Lamport support (feature-gated, default-enabled)
lamport_signature_plus = { version = "0.5.0", optional = true }
sha3 = { version = "0.12", optional = true }
sha2 = { version = "0.11", optional = true }
blake2 = { version = "0.11.0-rc.6", optional = true }
shake = { version = "0.1", optional = true }
blake3 = { version = "1.8", optional = true }
# XMSS support (feature-gated, default-enabled)
xmss = { version = "0.1.0-pre.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
blsful = { version = "4.0.0", default-features = false, features = ["rust"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
ssh-key = { version = "0.7.0-rc.11", default-features = false, features = ["alloc", "ecdsa", "ed25519"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blsful = { version = "4.0.0", default-features = false, features = ["blst"] }
ssh-key = { version = "0.7.0-rc.11", default-features = false, features = ["alloc", "ecdsa", "ed25519"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
hex = "0.4"
proptest = "1.11"
rand = "0.10"
serde_json = "1.0"
serde_test = "1.0"

[[bench]]
name = "multisig_bench"
harness = false
path = "benches/multisig_bench.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = { level = "allow", priority = 1 }

[lints.rust]
unsafe_code = "deny"

[patch.crates-io]
multi-codec = { path = "../multi-codec" }
